[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mlops_vera"
version = "0.0.1"
description = "Detecting real vs. AI-generated images"
authors = [
  { name = "Team Vera" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "dvc>=3.67.1",
    "great-expectations>=1.24.0",
    "huggingface-hub>=2.0.0",
    "joblib>=1.6.0",
    "loguru",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "open-clip-torch>=3.3.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pip",
    "pyarrow>=25.0.1",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "ruff",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["mlops_vera"]
include = ["pyproject.toml", "mlops_vera/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mlops_vera"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: behavioural tests on the trained model and real data (need `dvc pull`)",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
]

# CPU-only PyTorch wheels (the default Linux/Windows wheels bundle CUDA, ~2-3 GB).
# macOS uses PyPI, whose wheels are already CPU/MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
