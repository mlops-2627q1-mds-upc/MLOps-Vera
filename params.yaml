# Pipeline parameters — tracked by DVC (`dvc params diff` shows changes between commits).

data:
  repo_id: Rajarshi-Roy-research/Defactify_Image_Dataset
  # Pin to a commit sha for full reproducibility (printed in data/raw/defactify/source.json).
  revision: 787334f7857fa54f29027a7f09c30e895ad486ef
  # Number of captions to sample. Each caption group has ~12 images (~2 real + ~10 AI).
  n_captions: 800
  # Keep only captions that have all 6 siblings (real + 5 generators): preserves the
  # content-controlled pairing and the 5:1 ratio of the original dataset.
  complete_only: true
  seed: 42

preprocess:
  img_size: 224       # centre-crop to square, then resize (removes aspect-ratio shortcut)
  jpeg_quality: 90    # uniform re-encoding (removes format/compression shortcut)

split:
  # Caption-grouped: all siblings of a caption land in the same split (no leakage).
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 42

validate:
  # Great Expectations thresholds on the image metadata (DR-8). Observed values on the current
  # data in brackets, so the bounds catch broken data rather than normal variation.
  raw_size_range: [64, 4096]      # raw width/height in pixels [222, 1024]
  min_file_kb: 1.0                # preprocessed JPEG size [2.8, 32 KB]
  brightness_range: [5, 250]      # mean grey level, catches black/white images [16, 221]
  min_contrast: 4.0               # grey-level std, catches flat images [8.4, 114]
  ai_share_range: [0.80, 0.87]    # 5 generators per real photo = 0.833
  real_share_range: [0.12, 0.22]  # real share in each split [~0.167]
  max_split_share_deviation: 0.02 # caption share of each split vs. the split fractions above
  # No preprocessed-image feature alone may separate real from AI (ROC-AUC folded to [0.5, 1]).
  # Before preprocessing, the aspect ratio alone reaches 0.75.
  max_shortcut_auc: 0.60

embed:
  # Pretrained backbone, used frozen as a feature extractor (transfer learning; cheap enough
  # to run on CPU for our subsample): any torchvision classifier (resnet18, resnet50, ...) or
  # a CLIP image encoder (clip_vit_b_32).
  backbone: clip_vit_b_32
  batch_size: 64

train:
  # Logistic-regression head fitted on the frozen embeddings.
  # Inverse L2 regularisation strength. Chosen with a sweep over 0.001-1: C = 1 overfits the
  # 512-d CLIP embeddings (train ROC-AUC 1.00 vs 0.97 on val); below 0.01 the metrics level off
  # within the validation noise, so 0.01 is kept.
  C: 0.01
  # `balanced` reweights the loss by inverse class frequency, so the head stays calibrated
  # against the 5:1 fake:real imbalance (or any other ratio in future training data).
  class_weight: balanced
  max_iter: 1000
  seed: 42

logo:
  # Leave-one-generator-out (MR-4): one `logo@<generator>` stage per entry. Each run trains the
  # `train` head without that generator and tests it on real images + that generator only.
  holdout: [sd21, sdxl, sd3, dalle3, midjourney]
  # Bootstrap resamples for the 95% confidence interval of the unseen balanced accuracy
  # (each test set is small: ~190 real + ~190 generated images). Whole captions are resampled.
  n_bootstrap: 1000
  seed: 42
  # MR-4 target, checked on the worst held-out generator (strictest reading of the requirement).
  target_balanced_accuracy: 0.70

learning_curve:
  # Fractions of the training captions the `train` head is re-trained on; each fraction below 1
  # is averaged over `n_seeds` random draws of captions.
  fractions: [0.1, 0.25, 0.5, 0.75, 1.0]
  n_seeds: 5
